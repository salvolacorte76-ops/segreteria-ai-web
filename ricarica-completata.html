<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ricarica Completata - Segreteria Automatica AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #13233f 0%, #090d16 70%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(0, 180, 216, 0.35);
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 180, 216, 0.12);
    }
    .badge-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
      border: 2px solid #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }
    .brand {
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
    .subtitle { font-size: 15px; color: #cbd5e1; line-height: 1.5; margin-bottom: 24px; }
    .receipt {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 13px;
    }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-label { color: #94a3b8; }
    .receipt-val { color: #f1f5f9; font-weight: 600; font-family: monospace; }
    .highlight { color: #34d399; font-family: inherit; }
    .btn-close {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .hint { margin-top: 14px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge-icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="brand">Segreteria Automatica AI</div>
    <h1 id="titolo">Pagamento completato!</h1>
    <p class="subtitle" id="sottotitolo">
      Il tuo credito vocale è stato aggiornato e la tua assistente è subito pronta.
    </p>
    <div class="receipt">
      <div class="receipt-row">
        <span class="receipt-label">Pacchetto</span>
        <span class="receipt-val highlight">+100 Minuti Voce</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Importo</span>
        <span class="receipt-val" id="val-importo">20.00 €</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">ID Transazione</span>
        <span class="receipt-val" id="val-tx">—</span>
      </div>
    </div>
    <button class="btn-close" onclick="window.close()">Torna all'applicazione</button>
    <p class="hint">Se la scheda non si chiude automaticamente, puoi chiuderla manualmente.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const tx = params.get("tx");
    const importo = params.get("importo");
    const dup = params.get("dup");

    if (tx) document.getElementById("val-tx").textContent = tx;
    if (importo) document.getElementById("val-importo").textContent = importo + " €";
    if (dup === "1") {
      document.getElementById("titolo").textContent = "Ricarica già registrata";
      document.getElementById("sottotitolo").textContent =
        "Questa transazione era già stata elaborata e accreditata sul tuo dispositivo.";
    }
  </script>
</body>
</html>
